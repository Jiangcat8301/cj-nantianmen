name: build-windows

# ponytail: cross-compile Windows desktop + CLI on windows-latest runner.
# Output: 1 portable desktop EXE (x64) + 1 CLI bun-bundled EXE (x64).
# Triggers on vX.Y.Z tag, manual dispatch, or PR.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    branches: [main]

# ponytail: softprops/action-gh-release@v2 needs `contents: write` to attach EXEs.
# Same rationale as build-mac.yml — token defaults to read-only on many orgs.
permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ponytail: sync desktop/package.json version from tag (same pattern as build-mac.yml).
      # shell: bash — windows-latest defaults to PowerShell, but ${GITHUB_REF_NAME#v} is bash syntax.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${TAG}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          echo "desktop/package.json version -> $(node -p "require('./package.json').version")"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # ponytail: cli/ has no package-lock.json (zero dependencies) — caching a
          # non-existent file fails the step. Only desktop + server lock files.
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install server deps (better-sqlite3 native source)
        working-directory: server
        run: npm ci

      # ponytail: reuse desktop/package.json `electron:build` script — it already
      # copies the EXE into ../releases/ and cleans temp/win-unpacked. Single source of truth.
      # shell: bash — windows-latest defaults to PowerShell; electron:build script uses bash paths.
      - name: Build Windows desktop (x64 portable)
        shell: bash
        working-directory: desktop
        run: npm run electron:build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-windows-desktop-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-*-win-x64.exe

      # ponytail: attach to GitHub Release so it survives past the 14-day artifact window.
      - name: Attach desktop EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/nantianmen-*-win-x64.exe
          fail_on_unmatched_files: false

  cli:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ponytail: sync cli/package.json version from tag (desktop does its own above).
      # shell: bash — windows-latest defaults to PowerShell; ${GITHUB_REF_NAME#v} is bash syntax.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: cli
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${TAG}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          echo "cli/package.json version -> $(node -p "require('./package.json').version")"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # ponytail: cli/ has no package-lock.json (zero dependencies) — caching a
          # non-existent file fails the step. Only desktop + server lock files here.
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install cli deps
        working-directory: cli
        run: npm install --no-audit --no-fund

      # ponytail: reuse cli/package.json `cli:build` script — single source of truth for
      # bun --target=bun-windows-x64 + cp -r server into ../releases/server.
      # shell: pwsh — bun is installed by setup-bun into Windows PATH (C:\Users\runneradmin\.bun\bin),
      # which PowerShell resolves natively. Git Bash doesn't resolve the Windows user PATH
      # consistently (the earlier `$HOME/.bun/bin` export failed because $HOME in bash on
      # the GitHub runner ≠ the runneradmin user home). PowerShell + Windows PATH = works.
      # We can't run the cli:build script verbatim here — it uses bash && + cp -r syntax,
      # so we replicate the same commands with PowerShell-native idioms.
      - name: Build Windows CLI (x64)
        shell: pwsh
        working-directory: cli
        run: |
          $ErrorActionPreference = 'Stop'
          bun build ./index.js --compile --target=bun-windows-x64 --outfile=../releases/nantianmen-cli-${{ github.ref_name }}-win-x64.exe
          if (Test-Path ../releases/server) { Remove-Item -Recurse -Force ../releases/server }
          Copy-Item -Recurse ../server ../releases/server
          Get-ChildItem ../releases | Select-Object Name, Length

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-windows-cli-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-cli-*-win-x64.exe

      - name: Attach CLI EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/nantianmen-cli-*-win-x64.exe
          fail_on_unmatched_files: false