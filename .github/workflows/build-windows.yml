name: build-windows

# ponytail: v0.4.21 — Go server + Go CLI + Electron desktop.
# Output: 3 EXEs — server, CLI, desktop portable. Triggers on vX.Y.Z tag, manual dispatch, or PR.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ponytail: build Go server binary FIRST — desktop extraResources needs it.
  server:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # ponytail: go.mod says 1.26.3 which doesn't exist on GHA yet.
          # 1.23 is the latest stable; the module downgrades cleanly.

      - name: Build Go server (windows amd64)
        working-directory: server-go
        run: |
          go build -o ../releases/nantianmen-server-${{ github.ref_name }}-win-x64.exe ./cmd/nantianmen-server/

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-windows-server-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-server-*-win-x64.exe

      - name: Attach server EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/nantianmen-server-*-win-x64.exe
          fail_on_unmatched_files: false

  cli:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Go CLI (windows amd64)
        working-directory: server-go
        run: |
          go build -o ../releases/nantianmen-cli-${{ github.ref_name }}-win-x64.exe ./cmd/nantianmen/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-windows-cli-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-cli-*-win-x64.exe

      - name: Attach CLI EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/nantianmen-cli-*-win-x64.exe
          fail_on_unmatched_files: false

  desktop:
    needs: server
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ponytail: sync desktop/package.json version from tag.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${TAG}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          echo "desktop/package.json version -> $(node -p "require('./package.json').version")"

      # ponytail: download the Go server binary built by the `server` job.
      # extraResources expects server-go/../releases/nantianmen-server-*.exe.
      - name: Download Go server binary
        uses: actions/download-artifact@v4
        with:
          name: nantianmen-windows-server-${{ github.ref_name }}
          path: releases/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # ponytail: electron-builder reads extraResources from ../server-go/nantianmen-server.exe
      # (see desktop/package.json L59-63). The binary must exist there before electron:build.
      # Copy the downloaded artifact to where extraResources expects it.
      - name: Place Go server for extraResources
        shell: bash
        run: |
          mkdir -p server-go
          cp releases/nantianmen-server-*-win-x64.exe server-go/nantianmen-server.exe
          ls -lh server-go/nantianmen-server.exe

      - name: Build Windows desktop (x64 portable)
        shell: bash
        working-directory: desktop
        run: npm run electron:build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-windows-desktop-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-*-win-x64.exe

      - name: Attach desktop EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/nantianmen-*-win-x64.exe
          fail_on_unmatched_files: false
