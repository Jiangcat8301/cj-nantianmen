name: build-mac

# ponytail: cross-compile macOS desktop DMG on macos-latest runner.
# Output: arm64 + amd64 DMGs (matrix). Triggers on vX.Y.Z tag, manual dispatch, or PR.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    branches: [main]

# ponytail: softprops/action-gh-release@v2 needs `contents: write` to attach DMGs to the
# GitHub release. Many orgs / older repos default GITHUB_TOKEN to read-only, which is
# what produced the 403 "Resource not accessible by integration" on v0.2.14. Declaring it
# here is the minimum diff that fixes it without touching repo Settings.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    # ponytail: matrix over arm64 + amd64. Each arch gets its own upload + release attach.
    # arch is passed to electron-builder via --${{ matrix.arch }} CLI flag (overrides
    # package.json's hardcoded target arch). Earlier attempt rewrote package.json which
    # broke — electron-builder rejects build.mac.arch (arch lives inside target[].arch).
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      # ponytail: sync desktop/package.json version from the pushed tag so the artifactName
      # template (`nantianmen-${version}-mac-${arch}.${ext}`) produces 0.3.15 when the tag is
      # v0.3.15. PR runs leave it untouched (github.ref_name is not a semver tag there).
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${TAG}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          echo "desktop/package.json version -> $(node -p "require('./package.json').version")"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json
            cli/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install server deps (better-sqlite3 native source)
        working-directory: server
        run: npm ci

      # ponytail: vite build + electron-rebuild happen via package.json's electron:build:mac
      # script. For the electron-builder step itself we invoke it directly with --${{ matrix.arch }}
      # so each matrix leg produces the right arch DMG. CLI flag overrides package.json's arch.
      - name: Vite build
        working-directory: desktop
        run: npm run build

      - name: Rebuild native deps (better-sqlite3) for Electron's Node ABI
        working-directory: desktop
        run: npx @electron/rebuild -m ../server -w better-sqlite3 -f

      # ponytail: matrix.arch picks arm64 vs x64. Pass --${{ matrix.arch }} as CLI flag to
      # electron-builder — overrides package.json's hardcoded arch without touching source.
      # (Earlier attempt rewrote build.mac.arch in package.json, but electron-builder rejects
      # 'mac.arch' as unknown — arch belongs inside mac.target[].arch, not at mac level.)
      - name: Build mac (${{ matrix.arch }} dmg)
        working-directory: desktop
        run: npx electron-builder --mac --${{ matrix.arch }}
        env:
          # Skip code signing — no Apple Developer cert in CI. Builds ad-hoc signed binaries.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-mac-${{ matrix.arch }}-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: temp/nantianmen-*-mac-${{ matrix.arch }}.dmg

      # ponytail: attach the per-arch DMG to the GitHub Release so it survives past the
      # 14-day artifact retention window. Path filters to current matrix arch only.
      # On PRs the upload is a no-op (no release exists).
      - name: Attach ${{ matrix.arch }} DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: temp/nantianmen-*-mac-${{ matrix.arch }}.dmg
          fail_on_unmatched_files: false