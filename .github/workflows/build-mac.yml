name: build-mac

# ponytail: v0.5.1 — Go server cross-compile + Electron desktop DMG (arm64 only).
# Output: arm64 DMG only. Triggers on vX.Y.Z tag, manual dispatch, or PR.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ponytail: cross-compile Go server for macOS arm64 only (Intel Mac dropped at v0.5.1).
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile Go server (darwin arm64 only)
        working-directory: server
        run: |
          GOOS=darwin GOARCH=arm64 go build -o ../releases/nantianmen-server-${{ github.ref_name }}-mac-arm64 ./cmd/nantianmen-server/
          ls -lh ../releases/nantianmen-server-*

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-mac-server-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-server-*-mac-*

      - name: Attach server binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/nantianmen-server-*-mac-arm64
          fail_on_unmatched_files: false

  # ponytail: also cross-compile Go CLI for macOS arm64 only.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile Go CLI (darwin arm64 only)
        working-directory: cli
        run: |
          GOOS=darwin GOARCH=arm64 go build -o ../releases/nantianmen-cli-${{ github.ref_name }}-mac-arm64 .
          ls -lh ../releases/nantianmen-cli-*

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-mac-cli-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: releases/nantianmen-cli-*-mac-*

      - name: Attach CLI binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/nantianmen-cli-*-mac-arm64
          fail_on_unmatched_files: false

  mac:
    needs: server
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${TAG}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          echo "desktop/package.json version -> $(node -p "require('./package.json').version")"

      # ponytail: download the Go server binary (arm64 only since v0.5.1).
      - name: Download Go server binary
        uses: actions/download-artifact@v4
        with:
          name: nantianmen-mac-server-${{ github.ref_name }}
          path: releases/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # ponytail: place the arch-matched Go server binary where extraResources expects it.
      # main.cjs picks nantianmen-server (no .exe on macOS).
      - name: Place Go server for extraResources
        run: |
          mkdir -p server
          cp releases/nantianmen-server-*-mac-arm64 server/nantianmen-server
          chmod +x server/nantianmen-server
          ls -lh server/nantianmen-server

      - name: Vite build
        working-directory: desktop
        run: npm run build

      # ponytail: no better-sqlite3 rebuild needed — Go server is pure Go, no native Node deps.
      # The old @electron/rebuild step is removed for v0.4.21.

      - name: Build mac (arm64 dmg)
        working-directory: desktop
        run: npx electron-builder --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: nantianmen-mac-arm64-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: temp/nantianmen-*-mac-arm64.dmg

      - name: Attach arm64 DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: temp/nantianmen-*-mac-arm64.dmg
          fail_on_unmatched_files: false
